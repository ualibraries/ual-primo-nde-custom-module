@if (terms()) {
  <section class="ua-external-search">
    <h3 class="ua-ext-heading">
      <button type="button" class="ua-ext-toggle"
              [attr.aria-expanded]="expanded()"
              aria-controls="ua-external-search-list"
              (click)="toggle()">
        <span>External search</span>
        <svg class="ua-ext-chevron" [class.is-collapsed]="!expanded()" aria-hidden="true"
             viewBox="0 0 24 24" width="24" height="24">
          <path fill="currentColor" d="M7.41 15.41 12 10.83l4.59 4.58L18 14l-6-6-6 6z"/>
        </svg>
      </button>
    </h3>

    <ul id="ua-external-search-list" [hidden]="!expanded()">
      @for (link of links(); track link.name) {
        <li>
          <!-- [attr.href], not [href]: AssetsPublicPathDirective declares an `href`
               input, which swallows a [href] binding and leaves the link empty. -->
          <a [attr.href]="link.href" target="_blank" rel="noopener"
             [attr.aria-label]="'Search ' + link.name + ' for ' + terms() + ' (opens in a new tab)'">
            @if (link.logo) {
              <img [src]="link.logo" alt="" width="21" height="21">
            }
            <span>{{ link.name }}</span>
            <svg class="ua-ext-icon" aria-hidden="true" viewBox="0 0 24 24" width="16" height="16">
              <path fill="currentColor" d="M14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7zM19 19H5V5h7V3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7h-2v7z"/>
            </svg>
          </a>
        </li>
      }
    </ul>
  </section>
}
